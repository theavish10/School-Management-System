<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A//OS - Faculty Management</title>
    <style>
        :root {
            --bg: #050505; --surface: #0a0a0a; --accent: #00ccff; /* Blue for Faculty */
            --text: #fff; --border: #1a1a1a; --font-mono: 'Space Mono', monospace;
            --delete: #ff0055;
        }
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono&family=Syne:wght@800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-mono); display: flex; }

        /* Sidebar & Content Layout */
        .sidebar { 
            width: 260px; border-right: 1px solid var(--border); padding: 2rem; 
            position: fixed; height: 100vh; background: var(--bg); z-index: 1000;
            transition: transform 0.3s ease; 
        }
        .sidebar.closed { transform: translateX(-260px); }
        .sidebar ul li a:hover {
            color: var(--accent) !important;
        }
        .content { flex: 1; margin-left: 260px; padding: 40px; transition: margin-left 0.3s ease; }
        .content.full {transition:  0.3s ease;}

        /* Header & Buttons */
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .add-btn {
            background: var(--accent); color: #fff; border: none; padding: 12px 24px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .add-btn:hover { box-shadow: 0 0 10px var(--accent); }

        /* Faculty Grid */
        .faculty-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .faculty-card { 
            background: var(--surface); border: 1px solid var(--border); padding: 25px; 
            text-align: center; position: relative; transition: 0.3s;
        }
        .faculty-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        
        .avatar-circle { 
            width: 80px; height: 80px; background: #111; border: 1px solid var(--border); 
            border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; 
            justify-content: center; font-size: 1.5rem; color: var(--accent);
        }

        .role-tag { font-size: 0.6rem; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .name { font-family: 'Syne'; font-size: 1.2rem; margin: 10px 0; }
        .subject-tag { background: #111; padding: 4px 10px; font-size: 0.7rem; border-radius: 4px; color: #666; }

        /* Action Buttons on Card */
        .card-actions { margin-top: 20px; display: flex; justify-content: center; gap: 10px; border-top: 1px solid var(--border); padding-top: 15px; }
        .btn-small { background: transparent; border: 1px solid #333; color: #888; padding: 5px 10px; font-size: 0.6rem; cursor: pointer; transition: 0.3s; }
        .btn-small:hover { border-color: var(--accent); color: var(--accent); }
        .btn-small.del:hover { border-color: var(--delete); color: var(--delete); }

        /* --- Modal Styling --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: var(--surface); border: 1px solid var(--border); width: 500px; padding: 40px; border-top: 4px solid var(--accent); position: relative; }
        
        input, select { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; margin-bottom: 15px; font-family: var(--font-mono); }
        .save-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; }

        .close-x { position: absolute; top: 20px; right: 20px; color: #444; cursor: pointer; }

        .toggle-btn { position: fixed; bottom: 20px; left: 20px; z-index: 1100; background: var(--accent); border: none; padding: 10px; cursor: pointer; font-weight: bold; font-family: var(--font-mono); }
    </style>
</head>
<body>

    <button class="toggle-btn" onclick="toggleMenu()">MENU</button>

    <nav class="sidebar" id="sidebar">
        <div style="font-family: 'Syne'; font-size: 2rem; color: var(--accent); margin-bottom: 2rem;">A//OS</div>
        <ul id="navLinks" style="list-style: none;">
            </ul>
    </nav>

    <main class="content" id="mainContent">
        <div class="header-flex">
            <div>
                <h1 style="font-family: 'Syne'; font-size: 3rem;">FACULTY DIRECTORY</h1>
                <p style="color: #444;" id="staffCount">// STAFF DATABASE LOADED</p>
            </div>
            
            <button class="add-btn" onclick="openAddModal()">+ HIRE STAFF</button>  
        </div>
        <div style="margin-bottom: 20px;">
            <input type="text" id="facultySearch" placeholder="// FILTER STAFF BY NAME, DEPT OR ID..." 
            style="width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: var(--accent); outline: none; font-family: var(--font-mono); border-left: 4px solid var(--accent);"
            onkeyup="filterFaculty()">
        </div>
        <div class="faculty-grid" id="facultyGrid"></div>
    </main>

    <div id="facModal" class="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">[ CLOSE ]</span>
            <h2 id="modalTitle" style="font-family: 'Syne'; margin-bottom: 25px;">NEW FACULTY ENTRY</h2>
            
            <input type="hidden" id="editIndex">
            <input type="text" id="inputName" placeholder="FULL NAME">
            <input type="text" id="inputRole" placeholder="ROLE (e.g. Senior Faculty)">
            <input type="text" id="inputDept" placeholder="DEPARTMENT (e.g. Mathematics)">
            <input type="text" id="inputExp" placeholder="EXPERIENCE (e.g. 5 Years)">
            <input type="text" id="inputID" placeholder="TEACHER ID (e.g. T-101)">
            <div style="margin-bottom: 15px;">
                <input type="number" id="inputSalary" placeholder="MONTHLY SALARY (Default: 35000)" 
                style="width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff;">
            </div>
            <button class="save-btn" onclick="saveFaculty()">UPDATE STAFF DATABASE</button>
        </div>
    </div>

    <script>
    const role = localStorage.getItem('userRole') || 'admin';

    let facultyMembers = JSON.parse(localStorage.getItem('facultyDB')) || [
        { id: "FAC-001", name: "Mr. Rajesh Verma", role: "Head of Dept", dept: "Mathematics", exp: "12 Years" },
        { id: "FAC-002", name: "Mrs. Sunita Roy", role: "Senior Faculty", dept: "Science", exp: "8 Years" },
        { id: "FAC-003", name: "Ms. Sarah Khan", role: "Asst. Professor", dept: "English", exp: "5 Years" }
    ];

    function initPage() {
        renderSidebar();
        renderFaculty();
    }

    function renderSidebar() {
        const nav = document.getElementById('navLinks');
        if (role === 'admin') {
            nav.innerHTML = `
                <li style="margin: 1rem 0;"><a href="dashboard.html" style="color: #444; text-decoration: none;">DASHBOARD</a></li>
                <li style="margin: 1rem 0;"><a href="faculty.html" style="color: var(--accent); text-decoration: none;">FACULTY</a></li>
            `;
        } else {
            nav.innerHTML = `
                <li style="margin: 1rem 0;"><a href="dashboard.html" style="color: #444; text-decoration: none;">DASHBOARD</a></li>
                <li style="margin: 1rem 0;"><a href="faculty.html" style="color: var(--accent); text-decoration: none;">MY PROFILE</a></li>
            `;
        }
    }

    function renderFaculty() {
        const grid = document.getElementById('facultyGrid');
        const countDisplay = document.getElementById('staffCount');
        
        grid.innerHTML = facultyMembers.map((f, i) => `
            <div class="faculty-card">
                <div class="avatar-circle">${f.name.charAt(0)}</div>
                <div class="role-tag">${f.role}</div>
                <div class="name">${f.name}</div>
                <div class="experience">${f.exp}</div>
                <div style="font-size: 0.5rem; color: #333; margin-top: 5px;">UID: ${f.id || 'NO_ID'}</div>
                <br>
                <span class="subject-tag">${f.dept}</span>
                
                ${role === 'admin' ? `
                <div class="card-actions">
                    <button class="btn-small" onclick="openEditMode(${i})">EDIT</button>
                    <button class="btn-small del" onclick="deleteFaculty(${i})">TERMINATE</button>
                </div>` : ''}
            </div>
        `).join('');
        
        countDisplay.innerText = `// TOTAL STAFF: ${facultyMembers.length} ACTIVE MEMBERS`;
        localStorage.setItem('facultyDB', JSON.stringify(facultyMembers));
    }

    function openAddModal() {
        resetModal();
        document.getElementById('modalTitle').innerText = "NEW FACULTY ENTRY";
        document.getElementById('facModal').style.display = 'flex';
    }

    function openEditMode(index) {
        const f = facultyMembers[index];
        document.getElementById('modalTitle').innerText = "EDIT STAFF RECORD";
        document.getElementById('editIndex').value = index;

        document.getElementById('inputName').value = f.name;
        document.getElementById('inputRole').value = f.role;
        document.getElementById('inputDept').value = f.dept;
        document.getElementById('inputExp').value = f.exp;
        document.getElementById('inputID').value = f.id || "";

        document.getElementById('inputSalary').value = f.salary || 35000;
        document.getElementById('facModal').style.display = 'flex';
    }

    // function saveFaculty() {
    //     const name = document.getElementById('inputName').value;
    //     const roleTag = document.getElementById('inputRole').value;
    //     const dept = document.getElementById('inputDept').value;
    //     const exp = document.getElementById('inputExp').value;
    //     const customId = document.getElementById('inputID').value;
    //     const editIndex = document.getElementById('editIndex').value;

    //     if(!name || !dept) return alert("Please fill all detail!");
    //     const facData = { 
    //         id: customId || ("FAC-" + Date.now()),
    //         name: name, 
    //         role: roleTag, 
    //         dept: dept, 
    //         exp: exp 
    //     };

    //     if(editIndex === "") {
    //         facultyMembers.push(facData);
    //     } else {
    //         facultyMembers[editIndex] = facData;
    //     }

    //     renderFaculty(); 
    //     closeModal();
    // }

    function saveFaculty() {
    const name = document.getElementById('inputName').value;
    const roleTag = document.getElementById('inputRole').value;
    const dept = document.getElementById('inputDept').value;
    const exp = document.getElementById('inputExp').value;
    const customId = document.getElementById('inputID').value;
    // const salaryInput = document.getElementById('inputSalary').value;
    // const salary = salaryInput ? salaryInput : 35000; 
    // Naya: Salary box se value lena
    const salaryVal = document.getElementById('inputSalary').value;
    const salary = salaryVal ? salaryVal : 35000;
    
    const editIndex = document.getElementById('editIndex').value;

    if(!name || !dept) return alert("Please, fill all detail!");

    const facData = { 
        id: customId || ("FAC-" + Date.now()), 
        name: name, 
        role: roleTag, 
        dept: dept, 
        exp: exp,
        salary: salary 
    };

    if(editIndex === "") {
        facultyMembers.push(facData);
    } else {
        facultyMembers[editIndex] = facData;
    }

    renderFaculty(); 
    closeModal();
}

    function deleteFaculty(i) {
        if(confirm("Are you sure to terminate faculty! ")) {
            facultyMembers.splice(i, 1);
            renderFaculty();
        }
    }

    function resetModal() {
        document.getElementById('editIndex').value = "";
        document.getElementById('inputName').value = "";
        document.getElementById('inputRole').value = "";
        document.getElementById('inputDept').value = "";
        document.getElementById('inputExp').value = "";
    }

    function closeModal() { document.getElementById('facModal').style.display = 'none'; }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('closed');
        document.getElementById('mainContent').classList.toggle('full');
        const topBar = document.getElementById('topBar');
        if(topBar) topBar.classList.toggle('expanded');
    }

    function filterFaculty() {
        const query = document.getElementById('facultySearch').value.toLowerCase();
        const cards = document.querySelectorAll('.faculty-card');
        cards.forEach(card => {
            const text = card.innerText.toLowerCase(); 
            card.style.display = text.includes(query) ? "block" : "none";
        });
    }
    window.onload = initPage;
</script>
</body>
</html>
