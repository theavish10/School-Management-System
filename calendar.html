<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A//OS - Command Calendar</title>
    <style>
        :root {
            --bg: #050505; --surface: #0a0a0a; --accent: #ec7514; /* Neon Lime matching Dashboard */
            --text: #fff; --border: #1a1a1a; --font-main: 'Syne', sans-serif; 
            --font-mono: 'Space Mono', monospace;
        }
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono&family=Syne:wght@700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-mono); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar*/
        .sidebar { 
            width: 260px; border-right: 1px solid var(--border); padding: 2rem; 
            position: fixed; height: 100vh; background: var(--bg); z-index: 1000;
            transition: transform 0.3s ease; /* Smooth slide effect */
        }

        .sidebar.closed {transform: translateX(-260px);}
        .logo { font-family: 'Syne', sans-serif; font-size: 2.2rem; color: var(--accent); margin-bottom: 3rem; letter-spacing: -2px; }
        .nav-links li { list-style: none; margin: 1.5rem 0; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
        .nav-links a { text-decoration: none; color: #444; font-size: 1rem; transition: 0.3s; }
        .nav-links li.active a, .nav-links a:hover { color: var(--accent); }

        /* Content Area */
        .content { 
            flex: 1; margin-left: 260px; padding: 40px;    
            transition: margin-left 0.3s ease; /* Smooth shift effect */
        }
        .content.full { margin-left: 0; }
        h1 { font-family: 'Syne'; font-size: 3.5rem; text-transform: uppercase; margin-bottom: 2rem; letter-spacing: -2px; }

        /* Professional Calendar Container */
        .calendar-container { background: var(--surface); border: 1px solid var(--border); padding: 3rem; border-radius: 4px; position: relative; }
        .calendar-container::before { content: "// SYSTEM CALENDAR"; position: absolute; top: -10px; left: 20px; background: var(--bg); padding: 0 10px; color: var(--accent); font-size: 0.6rem; letter-spacing: 2px; }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .month-name { font-family: 'Syne'; font-size: 1.8rem; text-transform: uppercase; color: var(--text); }
        
        /* Grid Design (Pro Theme) */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
        .day-name { background: var(--surface); color: var(--accent); font-weight: bold; font-size: 0.7rem; padding: 15px 0; text-align: center; }
        
        .day { 
            background: var(--surface); padding: 20px; min-height: 110px; 
            display: flex; flex-direction: column; align-items: flex-start;
            position: relative; transition: 0.2s; cursor: pointer;
        }
        .day:hover { background: #151515; }
        .day span { font-size: 0.9rem; color: #666; font-weight: bold; }
        
        .today { border: 1px solid var(--accent); z-index: 2; background: rgba(204, 255, 0, 0.05); }
        .today span { color: var(--accent); }

        .event-chip { 
            width: 100%; font-size: 0.55rem; background: var(--accent); color: #000; 
            margin-top: 10px; padding: 4px 8px; font-weight: 800; border-radius: 2px;
            text-transform: uppercase;
        }

        .cal-nav-btn { background: none; border: 1px solid #333; color: #fff; padding: 8px 20px; cursor: pointer; font-family: var(--font-mono); font-size: 0.7rem; font-weight: bold; }
        .cal-nav-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        /* toggle button */
        .toggle-btn { 
            position: fixed; bottom: 20px; left: 20px; z-index: 1100; 
            background: var(--accent); border: none; padding: 10px; 
            cursor: pointer; font-weight: bold; font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <button class="toggle-btn" onclick="toggleMenu()">MENU</button>

    <nav class="sidebar" id="sidebar">
        <div class="logo">A//OS</div>
        <ul class="nav-links" id="navLinks">
            </ul>
    </nav>

    <main class="content" id="mainContent">
        <h1>SCHEDULE</h1>
        
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="cal-nav-btn" onclick="moveMonth(-1)">< PREV</button>
                <h2 id="currentMonthDisplay" class="month-name">JANUARY 2026</h2>
                <button class="cal-nav-btn" onclick="moveMonth(1)">NEXT ></button>
            </div>

            <div class="cal-grid" id="calendarBody">
                </div>
        </div>
    </main>

    <script>
        let date = new Date();
        const role = localStorage.getItem('userRole') || 'admin';

        function initPage() {
            renderSidebar();
            renderCalendar();
        }

        function renderSidebar() {
            const nav = document.getElementById('navLinks');
            if (role === 'admin') {
                nav.innerHTML = `
                    <li><a href="dashboard.html">DASHBOARD</a></li>
                    <li class="active"><a href="calendar.html">CALENDAR</a></li>
                    <li><a href="notices.html">NOTICES</a></li>
                `;
            } else if (role === 'teacher') {
                nav.innerHTML = `
                    <li><a href="dashboard.html">DASHBOARD</a></li>
                    <li><a href="students.html">MY STUDENTS</a></li>
                    <li><a href="attendance.html">ATTENDANCE</a></li>
                    <li class="active"><a href="calendar.html">CALENDAR</a></li>
                `;
            } else {
                nav.innerHTML = `
                    <li><a href="dashboard.html">DASHBOARD</a></li>
                    <li class="active"><a href="calendar.html">CALENDAR</a></li>
                    <li><a href="exams.html">MY RESULTS</a></li>
                `;
            }
        }

        function renderCalendar() {
            const calendarBody = document.getElementById('calendarBody');
            const monthDisplay = document.getElementById('currentMonthDisplay');
            calendarBody.innerHTML = '';

            const month = date.getMonth();
            const year = date.getFullYear();

            const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
            monthDisplay.innerText = `${monthNames[month]} ${year}`;

            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            days.forEach(d => calendarBody.innerHTML += `<div class="day-name">${d}</div>`);

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            for (let x = firstDayIndex; x > 0; x--) {
                calendarBody.innerHTML += `<div class="day" style="opacity: 0.05;"></div>`;
            }

            for (let i = 1; i <= lastDay; i++) {
                const isToday = i === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();
                let eventHtml = '';
                if(month === 0 && i === 26) eventHtml = `<div class="event-chip">REPUBLIC DAY</div>`;
                if(month === 0 && i === 1) eventHtml = `<div class="event-chip">NEW YEAR</div>`;

                calendarBody.innerHTML += `
                    <div class="day ${isToday ? 'today' : ''}">
                        <span>${i < 10 ? '0' + i : i}</span>
                        ${eventHtml}
                    </div>
                `;
            }
        }

        function moveMonth(dir) {
            date.setMonth(date.getMonth() + dir);
            renderCalendar();
        }

        // Navigation Toggle
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('closed');
        document.getElementById('mainContent').classList.toggle('full');

        const topBar = document.getElementById('topBar');
        if(topBar) topBar.classList.toggle('expanded');
    }
        window.onload = initPage;
    </script>
</body>
</html>
